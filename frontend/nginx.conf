server {
    listen 80;

    # Thư mục chứa static files React
    root /usr/share/nginx/html;
    index index.html;

    # Quan trọng với React Router:
    # Khi user truy cập /login, /tasks, v.v. trực tiếp trên trình duyệt,
    # nginx không tìm thấy file vật lý → trả về index.html
    # React Router sẽ tự xử lý routing phía client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tối ưu: cache static assets (JS, CSS, images) 1 năm
    # Browser không cần re-download mỗi lần visit
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tắt log cho favicon (giảm noise trong logs)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
