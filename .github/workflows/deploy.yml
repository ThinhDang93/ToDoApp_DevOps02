name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4        # v3 → v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6   # v5 → v6
        with:
          context: ./backend
          push: true
          tags: |
            thinhdang93/todo-backend-devops02:latest
            thinhdang93/todo-backend-devops02:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v6   # v5 → v6
        with:
          context: ./frontend
          push: true
          tags: |
            thinhdang93/todo-frontend-devops02:latest
            thinhdang93/todo-frontend-devops02:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
